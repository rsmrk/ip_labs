<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №7: CSS Flexbox (Варіант 4)</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header id="events_container">
        <div class="event-item">
            <span class="tag">Увага!</span> 
            <span>День відкритих дверей 20.01.2026.</span>
        </div>

        <div class="event-item">
            <span class="tag important">Новина:</span> 
            <span>Оголошено результати наукового конкурсу.</span>
        </div>

        <div class="event-item">
            <span class="tag">Оголошення:</span> 
            <span>Терміни оплати за навчання.</span>
        </div>

        <a href="#" class="more-link">Детальніше про події »</a>
    </header>

    <main>
        <h1>Головна сторінка</h1>
        <p>Блок сповіщень (header#events_container) зверстано за допомогою Flexbox.</p>
    </main>

</body>
</html>
